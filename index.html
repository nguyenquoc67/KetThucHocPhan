<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineFind — Movie Discovery App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="marquee-lights" aria-hidden="true"></div>
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">🎬</span>
        <span class="brand-name">CineFind</span>
      </div>

      <div class="header-actions">
        <a class="prev-link" href="bt35.html">Bài 35</a>
        <a class="prev-link" href="bt36.html">Bài 36</a>
        <label class="theme-switch" title="Chuyển chế độ sáng/tối">
          <input type="checkbox" id="themeToggle">
          <span class="switch-track">
            <span class="switch-thumb"></span>
          </span>
          <span class="switch-icon sun">☀</span>
          <span class="switch-icon moon">☾</span>
        </label>
      </div>
    </div>
    <div class="marquee-lights" aria-hidden="true"></div>
  </header>

  <main class="app-grid">

    <aside class="sidebar">
      <div class="ticket-tab">
        <h2 class="ticket-title">Bộ lọc</h2>
        <span class="ticket-sub">tìm đúng bộ phim bạn muốn xem</span>
      </div>

      <div class="field-group">
        <label class="field-label" for="searchInput">Tìm theo tên phim</label>
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="VD: Titan, Người..." autocomplete="off">
        </div>
      </div>

      <div class="perforation" aria-hidden="true"></div>

      <div class="field-group">
        <div class="field-label-row">
          <label class="field-label">Thể loại</label>
          <button class="clear-btn" id="clearGenres">Bỏ chọn hết</button>
        </div>
        <div id="genreList" class="genre-list"><!-- sinh động bằng JS --></div>
      </div>

      <div class="result-count mono" id="resultCount">— phim</div>
    </aside>

    <section class="content">
      <div id="movieGrid" class="movie-grid"><!-- sinh động bằng JS --></div>
      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-icon">🎞️</div>
        <p>Không tìm thấy phim nào khớp với bộ lọc hiện tại.</p>
      </div>
    </section>

  </main>

  <div id="modalOverlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Đóng">✕</button>
      <div class="modal-body" id="modalBody"><!-- sinh động bằng JS --></div>
    </div>
  </div>

  <footer class="site-footer">
    <span>CineFind — Movie Discovery App</span>
    <span class="foot-links">
      <a href="bt35.html">Bài tập 35</a> · <a href="bt36.html">Bài tập 36</a>
    </span>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
